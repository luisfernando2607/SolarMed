name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, bcmath, openssl, dom, mbstring, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependencias y build del frontend
        run: |
          npm ci
          npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar pruebas
        run: php artisan test
